services:

  db:
    image: postgres:16
    ports:
      - 5432:5432
    networks:
      - result-tier
      - back-tier
    env_file:
      - .env
    volumes:
      - ./db-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7
    restart: always
    env_file:
      - .env
    ports:
      - '6379:6379'
    networks:
      - poll-tier
      - back-tier

  poll:
    build: poll
    depends_on:
      redis:
        condition: service_started
    env_file:
      - .env
    networks:
      - poll-tier
    ports:
      - "5000:80"
  
  worker:
    build: worker
    depends_on:
      redis:
        condition: service_started
    env_file:
      - .env
    networks:
      - back-tier

  result:
    build: result
    env_file:
      - .env
    depends_on:
      db:
        condition: service_started
    networks:
      - result-tier
    ports:
      - "5001:80"

networks:
  poll-tier:
  result-tier:
  back-tier:

volumes:
  db_data:
